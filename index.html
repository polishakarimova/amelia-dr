<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Повод — карточка праздника в одной ссылке</title>
  <meta name="description" content="Есть повод — собрать праздник в одной ссылке. Дата, место, пожелания и подарки в аккуратной карточке для гостей." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #FFF8F3;
      --bg-soft: #FFF0E8;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-solid: #FFFFFF;
      --text: #28231F;
      --muted: #766D66;
      --muted-light: #9A9089;
      --border: rgba(40, 35, 31, 0.10);
      --primary: #EB7357;
      --primary-hover: #D95F45;
      --primary-soft: #FFE1D6;
      --dark: #28231F;
      --dark-hover: #171411;
      --lavender: #E8DDFF;
      --peach: #FFE3D3;
      --mint: #DDF1EC;
      --cream: #FFF4D6;
      --success: #3D9B6D;
      --success-soft: #E2F5EC;
      --warning: #C9822B;
      --warning-soft: #FFF1D6;
      --danger: #D85A4A;
      --danger-soft: #FFE1DE;
      --milk: var(--bg);
      --paper: var(--surface);
      --paper-strong: var(--surface-solid);
      --ink: var(--text);
      --line: var(--border);
      --coral: var(--primary);
      --coral-dark: var(--primary-hover);
      --blue: #8fc7e8;
      --sand: var(--bg-soft);
      --green: #3f8d68;
      --shadow: 0 20px 70px rgba(50, 40, 35, 0.10);
      --shadow-soft: 0 20px 70px rgba(50, 40, 35, 0.10);
      --shadow-card: 0 14px 40px rgba(50, 40, 35, 0.08);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --radius-pill: 999px;
    }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Onest, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 10%, rgba(230,111,92,.20), transparent 28%),
        radial-gradient(circle at 84% 7%, rgba(185,168,255,.24), transparent 26%),
        radial-gradient(circle at 76% 74%, rgba(143,199,232,.20), transparent 30%),
        linear-gradient(180deg, #fffaf4 0%, var(--milk) 45%, #fff 100%);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body.theme-blue {
      --coral: #5aa6e8;
      --coral-dark: #2367a7;
      --lavender: #8fc7e8;
      --sand: #e8f4ff;
      background:
        radial-gradient(circle at 9% 10%, rgba(90,166,232,.22), transparent 28%),
        radial-gradient(circle at 84% 7%, rgba(143,199,232,.25), transparent 26%),
        radial-gradient(circle at 76% 74%, rgba(185,168,255,.16), transparent 30%),
        linear-gradient(180deg, #f7fbff 0%, #eef7ff 45%, #fff 100%);
    }
    body.theme-neutral {
      --coral: #8b7a66;
      --coral-dark: #5b4e42;
      --lavender: #d0c8bd;
      --sand: #f0ebe5;
      background:
        radial-gradient(circle at 9% 10%, rgba(139,122,102,.16), transparent 28%),
        radial-gradient(circle at 84% 7%, rgba(143,199,232,.14), transparent 26%),
        linear-gradient(180deg, #fbfaf8 0%, #f3eee8 45%, #fff 100%);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 18px 34px;
    }
    .topbar {
      position: sticky;
      top: calc(10px + env(safe-area-inset-top));
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 8px;
      margin: 0 0 20px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 28px;
      background: rgba(255,255,255,.62);
      box-shadow: 0 18px 54px rgba(53,39,31,.08);
      backdrop-filter: blur(22px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-weight: 780;
      font-size: 18px;
      letter-spacing: -.015em;
      text-decoration: none;
      padding: 4px 8px 4px 4px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.95), rgba(255,255,255,.56)),
        radial-gradient(circle at 30% 25%, rgba(230,111,92,.35), transparent 42%);
      border: 1px solid rgba(230,111,92,.22);
      box-shadow: 0 10px 28px rgba(230,111,92,.16);
      color: var(--coral-dark);
      font-size: 18px;
    }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      border: 0;
      padding: 11px 17px;
      font-weight: 780;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 16px 34px rgba(37,35,33,.18);
    }
    .btn-accent {
      background: linear-gradient(135deg, var(--coral), #e8a05d);
      color: #fff;
      box-shadow: 0 18px 42px rgba(230,111,92,.24);
    }
    .btn-soft {
      background: rgba(255,255,255,.72);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
    }
    .btn-small { min-height: 44px; padding: 8px 12px; font-size: 13px; }
    .btn-danger { color: #9b2f26; background: #fff1ee; border: 1px solid rgba(230,111,92,.25); }
    .view { display: none; animation: enter .24s ease both; }
    .view.active { display: block; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 42px;
      align-items: center;
      max-width: 840px;
      padding: 58px 0 38px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      border: 1px solid var(--line);
      color: var(--coral-dark);
      font-size: 13px;
      font-weight: 800;
    }
    h1, h2, h3, h4 { margin: 0; letter-spacing: -.025em; font-weight: 800; }
    h1 {
      max-width: 760px;
      font-size: clamp(40px, 5.4vw, 68px);
      line-height: 1.03;
      margin-bottom: 20px;
      text-wrap: balance;
    }
    .lead {
      max-width: 640px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.55;
      margin: 0 0 26px;
      text-wrap: pretty;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .microcopy { max-width: 620px; color: #817970; font-size: 13px; line-height: 1.55; }
    .muted { color: var(--muted); }
    .status { font-size: 12px; font-weight: 850; color: var(--green); }
    .status.reserved { color: var(--coral-dark); }
    .section-title { max-width: 780px; margin: 54px auto 20px; text-align: center; }
    .section-title h2 { font-size: clamp(30px, 4vw, 48px); line-height: 1.04; margin-bottom: 10px; text-wrap: balance; }
    .section-title p { color: var(--muted); line-height: 1.65; text-wrap: pretty; }
    .grid { display: grid; gap: 14px; }
    .grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .card {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 14px 42px rgba(53,39,31,.08);
    }
    .info-card { padding: 22px; min-height: 156px; }
    .info-card .icon {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 15px;
      background: #fff;
      color: var(--coral-dark);
      margin-bottom: 13px;
      font-weight: 900;
    }
    .info-card h3 { font-size: 18px; margin-bottom: 8px; }
    .info-card p { color: var(--muted); line-height: 1.55; font-size: 14px; margin: 0; }
    .steps-line { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .step-card { padding: 24px; }
    .step-num {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 50%; background: var(--ink); color: #fff;
      font-weight: 800; margin-bottom: 14px;
    }
    .occasion-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .occasion-chip {
      padding: 12px 15px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 750;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 36px 0 20px;
    }
    .page-head h2 { font-size: clamp(34px, 4.2vw, 52px); line-height: 1.05; margin-bottom: 10px; }
    .page-head p { color: var(--muted); line-height: 1.6; max-width: 640px; }
    .auth-card, .panel { max-width: 520px; margin: 26px auto; padding: 24px; }
    .auth-primary {
      margin-top: 18px;
      padding: 16px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(143,199,232,.22), rgba(255,255,255,.78));
      border: 1px solid rgba(143,199,232,.32);
    }
    .auth-primary h3 { font-size: 19px; margin-bottom: 6px; }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .auth-secondary {
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,.54);
      border: 1px solid var(--line);
    }
    .auth-secondary summary {
      cursor: pointer;
      font-weight: 850;
      color: var(--ink);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 750; }
    label.full { grid-column: 1 / -1; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.9);
      color: var(--ink);
      outline: none;
      padding: 13px 14px;
    }
    textarea { resize: vertical; min-height: 92px; }
    input:focus, textarea:focus, select:focus { border-color: rgba(230,111,92,.42); box-shadow: 0 0 0 4px rgba(230,111,92,.08); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .event-item { padding: 18px; display: grid; grid-template-columns: 80px 1fr; gap: 14px; }
    .event-preview {
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #fff0e7, #ede9ff);
      display: grid; place-items: center;
      color: var(--coral-dark);
      font-weight: 900;
    }
    .event-item h3 { font-size: 20px; margin-bottom: 5px; }
    .event-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .status-pill {
      display: inline-flex; width: fit-content;
      padding: 6px 9px; border-radius: 999px;
      background: #fff; border: 1px solid var(--line);
      color: var(--muted); font-size: 12px; font-weight: 800;
    }
    .editor-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
    .editor-card { padding: 22px; max-width: 850px; }
    .step-progress {
      display: grid;
      gap: 12px;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 24px;
      background: rgba(255,255,255,.58);
      border: 1px solid var(--line);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(37,35,33,.08);
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--coral), #e8a05d);
      transition: width .24s ease;
    }
    .step-dots {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .tab { flex: 0 0 auto; }
    .tab.active { background: var(--ink); color: #fff; }
    .tab.done { background: rgba(255,255,255,.8); color: var(--coral-dark); }
    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-option {
      padding: 15px; border-radius: 20px; border: 1px solid var(--line);
      background: rgba(255,255,255,.72); text-align: left;
    }
    .theme-option b { display: block; font-size: 17px; margin-bottom: 5px; }
    .theme-option.active { border-color: rgba(230,111,92,.45); box-shadow: 0 14px 32px rgba(230,111,92,.12); }
    .cover-upload {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 16px;
      align-items: center;
      padding: 14px;
      border: 1px dashed rgba(230,111,92,.38);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,241,236,.72), rgba(255,255,255,.72));
    }
    .cover-preview {
      height: 140px;
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 25%, rgba(230,111,92,.25), transparent 34%),
        radial-gradient(circle at 78% 16%, rgba(143,199,232,.28), transparent 34%),
        linear-gradient(135deg, #fff2e8, #efeaff);
      color: var(--coral-dark);
      font-weight: 850;
    }
    .cover-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-copy { min-width: 0; }
    .cover-copy h3 { font-size: 20px; margin-bottom: 6px; }
    .cover-copy p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
    .cover-copy input { max-width: 100%; min-width: 0; padding: 10px; border-radius: 14px; font-size: 13px; }
    .field-hint {
      display: block;
      color: rgba(112,106,100,.68);
      font-size: 12px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.45;
    }
    .template-box {
      grid-column: 1 / -1;
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(255,255,255,.58);
      border: 1px solid var(--line);
    }
    .template-box h4 {
      font-size: 14px;
      letter-spacing: 0;
    }
    .template-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .template-options .btn {
      min-height: 36px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .gift-editor { display: grid; gap: 10px; }
    .gift-form {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 24px;
      background: rgba(255,255,255,.7);
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .gift-form h3 { font-size: 22px; }
    .guest-layout { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .guest-side { position: sticky; top: 88px; padding: 18px; }
    .guest-cover {
      min-height: 170px; border-radius: 26px; margin-bottom: 16px;
      background: linear-gradient(135deg, #fff0e7, #ede9ff);
      display: grid; place-items: center; overflow: hidden;
    }
    .guest-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .guest-side h2 { font-size: 28px; margin-bottom: 10px; }
    .guest-side p { color: var(--muted); line-height: 1.6; }
    .guest-gifts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .wishlist-intro { padding: 18px; margin-bottom: 14px; }
    .wishlist-intro h3 { font-size: 22px; margin-bottom: 8px; }
    .wishlist-intro p { margin: 0; color: var(--muted); line-height: 1.55; }
    .gift-card { overflow: hidden; }
    .gift-card.reserved { opacity: .72; }
    .gift-img { height: 178px; background: var(--sand); position: relative; }
    .gift-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gift-body { padding: 15px; }
    .gift-body h3 { font-size: 17px; margin-bottom: 7px; }
    .gift-body p { color: var(--muted); line-height: 1.45; min-height: 58px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .gift-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 12px 0; }
    .price { font-weight: 850; }
    .tag { font-size: 12px; color: var(--coral-dark); background: #fff1ec; padding: 6px 9px; border-radius: 999px; font-weight: 800; }
    .gift-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .modal {
      position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
      background: rgba(37,35,33,.36); backdrop-filter: blur(10px);
    }
    .modal.active { display: flex; }
    .modal-card { width: min(460px, 100%); padding: 24px; background: #fff; border-radius: 28px; box-shadow: 0 30px 90px rgba(37,35,33,.25); }
    .modal-card.wide { width: min(760px, 100%); }
    .modal-card h3 { font-size: 24px; margin-bottom: 10px; }
    .crop-stage {
      position: relative;
      height: min(56vw, 430px);
      min-height: 280px;
      margin: 18px 0 14px;
      border-radius: 26px;
      overflow: hidden;
      background: #171514;
      touch-action: none;
      user-select: none;
    }
    .crop-stage img {
      position: absolute;
      left: 50%;
      top: 50%;
      width: auto;
      height: auto;
      max-width: none;
      transform-origin: center;
      will-change: transform;
      pointer-events: none;
    }
    .crop-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(88%, 560px);
      aspect-ratio: 12 / 7;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,.96);
      border-radius: 24px;
      box-shadow: 0 0 0 999px rgba(0,0,0,.48), inset 0 0 0 1px rgba(255,255,255,.45);
      pointer-events: none;
    }
    .crop-frame::after {
      content: "";
      position: absolute;
      inset: 33.333% 0;
      border-top: 1px solid rgba(255,255,255,.38);
      border-bottom: 1px solid rgba(255,255,255,.38);
    }
    .crop-frame::before {
      content: "";
      position: absolute;
      inset: 0 33.333%;
      border-left: 1px solid rgba(255,255,255,.38);
      border-right: 1px solid rgba(255,255,255,.38);
    }
    .crop-tools {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .crop-tools input[type="range"] { padding: 0; accent-color: var(--coral); }
    .toast {
      position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 140;
      width: min(92vw, 420px); transform: translate(-50%, 120px); opacity: 0;
      padding: 13px 16px; border-radius: 999px; background: rgba(255,255,255,.96); color: var(--ink);
      text-align: center; font-weight: 850; box-shadow: 0 18px 54px rgba(37,35,33,.18); transition: .24s ease;
    }
    .toast.active { opacity: 1; transform: translate(-50%, 0); }
    .hidden { display: none !important; }
    .footer { padding: 34px 0 12px; color: var(--muted); text-align: center; font-size: 13px; }
    body {
      background: linear-gradient(180deg, var(--bg) 0%, #fffdfa 55%, #fff 100%);
    }
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
      inset: -140px -120px auto;
      height: 660px;
      background:
        radial-gradient(circle at 12% 22%, rgba(255, 179, 143, .48), transparent 27%),
        radial-gradient(circle at 78% 12%, rgba(232, 221, 255, .78), transparent 24%),
        radial-gradient(circle at 66% 72%, rgba(221, 241, 236, .76), transparent 28%),
        radial-gradient(circle at 38% 70%, rgba(255, 244, 214, .72), transparent 26%);
      filter: blur(16px);
    }
    body.theme-blue {
      --primary: #5A9FE8;
      --primary-hover: #2870B4;
      --primary-soft: #E1F0FF;
      --bg: #F7FBFF;
      --bg-soft: #EAF5FF;
      --peach: #D9ECFF;
      --lavender: #E6F0FF;
      --coral: var(--primary);
      --coral-dark: var(--primary-hover);
      background: linear-gradient(180deg, var(--bg) 0%, #fbfdff 55%, #fff 100%);

<body>
  <main class="shell">
    <nav class="topbar">
      <button class="brand" type="button" data-route="/">

      <div class="top-actions" id="topActions"></div>
    </nav>

    <section class="view active" id="homeView"></section>
    <section class="view" id="authView"></section>
    <section class="view" id="dashboardView"></section>
    <section class="view" id="editorView"></section>
    <section class="view" id="publicView"></section>

    <footer class="footer">mypovod.ru · Есть повод — собрать праздник в одной ссылке.</footer>
  </main>

  <div class="modal" id="reserveModal" onclick="if(event.target===this)closeModal('reserveModal')">
    <div class="modal-card">
      <h3>Забронировать подарок</h3>
      <p class="muted" id="reserveGiftName"></p>
      <div class="form-grid" style="grid-template-columns:1fr">
        <label>Имя<input id="reserveName" placeholder="Например, Мария" /></label>
        <label>Контакт необязательно<input id="reserveContact" placeholder="Телефон или мессенджер" /></label>
        <label>Комментарий необязательно<textarea id="reserveComment" placeholder="Например, куплю на Wildberries"></textarea></label>
      </div>
      <div class="hero-actions" style="margin-top:14px">
        <button class="btn btn-soft" type="button" onclick="closeModal('reserveModal')">Отмена</button>
        <button class="btn btn-soft" type="button" onclick="reserveGift(true)">Анонимно</button>
        <button class="btn btn-primary" type="button" onclick="reserveGift()">Подтвердить</button>
      </div>
    </div>
  </div>
  <div class="modal" id="coverCropModal" onclick="if(event.target===this)closeCoverCrop()">
    <div class="modal-card wide">
      <h3>Настроить фото</h3>
      <p class="muted">Подвиньте фото и выберите масштаб. Светлая рамка показывает, что попадёт в обложку карточки.</p>
      <div class="crop-stage" id="cropStage">
        <img id="cropImage" alt="">
        <div class="crop-frame" id="cropFrame"></div>
      </div>
      <div class="crop-tools">
        <label>Масштаб<input id="cropScale" type="range" min="1" max="3" step="0.01" value="1"></label>
        <button class="btn btn-soft" type="button" onclick="chooseAnotherCover()">Выбрать другое фото</button>
      </div>
      <div class="hero-actions" style="margin-top:14px">
        <button class="btn btn-soft" type="button" onclick="closeCoverCrop()">Отмена</button>
        <button class="btn btn-primary" type="button" onclick="saveCroppedCover()">Сохранить кадр</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const APP_NAME = 'Повод';
    const DOMAIN = 'mypovod.ru';
    const STORAGE = {
      users: 'povod_users',
      session: 'povod_session',
      events: 'povod_events'
    };
    let route = '/';
    let currentUser = null;
    let currentEventId = null;
    let editorTab = 'style';
    let pendingReserve = null;
    let coverCrop = null;
    let giftFormOpen = false;
    let editingGiftId = null;
    const BASE_PATH = location.pathname.startsWith('/amelia-dr') ? '/amelia-dr' : '';

    const sampleGifts = [
      { id: uid(), title: 'Самокат', description: 'Лёгкий самокат для прогулок во дворе.', url: '#', price: 4200, image: 'https://images.unsplash.com/photo-1567599843819-1b6a9a05b6da?w=600&h=420&fit=crop', category: 'Активное', status: 'available' },
      { id: uid(), title: 'LEGO', description: 'Набор для спокойной игры и сборки.', url: '#', price: 3100, image: 'https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=600&h=420&fit=crop', category: 'Игрушки', status: 'reserved', reservedByName: 'Анна', reservedComment: 'Уже заказала' },
      { id: uid(), title: 'Сертификат на фотосессию', description: 'Тёплая семейная съёмка после праздника.', url: '#', price: 5000, image: 'https://images.unsplash.com/photo-1511895426328-dc8714191300?w=600&h=420&fit=crop', category: 'Впечатления', status: 'available' }
    ];
    const TEXT_TEMPLATES = {
      description: [
        { label: 'Тёплое приглашение', text: 'Будем очень рады разделить с вами наш праздник. Приходите провести этот день рядом с нами — будет тепло, весело и по-семейному.' },
        { label: 'Коротко и понятно', text: 'Приглашаем вас на праздник! Дата, время и место — ниже. Очень ждём и будем рады видеть вас среди гостей.' },
        { label: 'Нежный вариант', text: 'У нас скоро особенный день, и нам хочется провести его рядом с близкими людьми. Будем счастливы, если вы сможете прийти.' },
        { label: 'С юмором', text: 'У нас намечается праздник, где будут радость, гости и немного организованного хаоса. Приходите, без вас этот день будет совсем не тот.' }
      ],
      wishes: [
        { label: 'По погоде', text: 'Праздник будет проходить на улице, поэтому, пожалуйста, одевайтесь по погоде. Лучше выбрать удобную одежду и обувь.' },
        { label: 'Удобная одежда', text: 'Будет активный формат праздника, поэтому лучше выбрать одежду, в которой удобно двигаться, играть и гулять.' },
        { label: 'Дресс-код', text: 'Если хочется поддержать настроение праздника, можно добавить в образ ковбойские элементы: шляпу, платок, джинсу или что-то в этом стиле.' }
      ]
    };
    const BUILDER_STEPS = [
      { id: 'style', label: 'Тип повода' },
      { id: 'details', label: 'Детали' },
      { id: 'gifts', label: 'Подарки' },
      { id: 'publish', label: 'Ссылка' }
    ];
    const OCCASION_TYPES = [
      { type: 'День рождения девочки', theme: 'pink', label: 'День рождения девочки', hint: 'Мягкая светлая тема для детского дня рождения.', colors: ['#FFE3D3', '#E8DDFF', '#FFE1D6'] },
      { type: 'День рождения мальчика', theme: 'blue', label: 'День рождения мальчика', hint: 'Голубая тема с более свежим и активным настроением.', colors: ['#D9ECFF', '#E6F0FF', '#E1F0FF'] },
      { type: 'Взрослый день рождения', theme: 'neutral', label: 'Взрослый день рождения', hint: 'Спокойная взрослая карточка без детского визуала.', colors: ['#EFE8DE', '#E7E1D9', '#F0EBE5'] }
    ];

    function uid() {
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }
    function slugify(text) {
      return (text || 'event').toLowerCase().trim()
        .replace(/ё/g, 'e').replace(/й/g, 'i')
        .replace(/[^a-zа-я0-9]+/gi, '-').replace(/^-+|-+$/g, '') || `event-${uid()}`;
    }
    function money(value) {
      return Number(value || 0).toLocaleString('ru-RU') + ' ₽';
    }
    function getJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
      catch { return fallback; }
    }
    function setJSON(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
    function users() { return getJSON(STORAGE.users, []); }
    function events() { return getJSON(STORAGE.events, []); }
    function saveEvents(list) { setJSON(STORAGE.events, list); }
    function sessionEmail() { return localStorage.getItem(STORAGE.session); }
    function setSession(email) { email ? localStorage.setItem(STORAGE.session, email) : localStorage.removeItem(STORAGE.session); }
    function me() {
      const email = sessionEmail();
      return users().find(user => user.email === email) || null;
    }
    function displayUserName(user) {
      return user?.name || user?.telegramUsername || user?.email || 'Организатор';
    }
    function toast(text) {
      const node = document.getElementById('toast');
      node.textContent = text;
      node.classList.add('active');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => node.classList.remove('active'), 2400);
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function navigate(path) {
      history.pushState({}, '', `${BASE_PATH}${path}`);
      render();
    }
    function appPath() {
      const redirected = new URLSearchParams(location.search).get('path');
      if (redirected) return redirected.split('?')[0] || '/';
      const raw = location.pathname.replace(BASE_PATH, '') || '/';
      return raw === '/index.html' ? '/' : raw;
    }
    function publicUrl(event) {
      return `${location.origin}${BASE_PATH}/p/${event.slug}`;
    }
    function yandexMapUrl(event) {
      const q = encodeURIComponent([event.placeName, event.address].filter(Boolean).join(', '));
      return event.mapUrl || `https://yandex.ru/maps/?text=${q}`;
    }
    function seed() {
      if (events().length) return;
      const demo = {
        id: uid(),
        userId: 'demo',
        title: 'День рождения Мели',
        slug: 'meli-birthday',
        type: 'Детский день рождения',
        theme: 'pink',
        date: '2026-06-14',
        time: '15:00',
        placeName: 'Центральный парк',
        address: 'Москва, Крымский Вал, 9',
        description: 'Будем рады разделить этот день с близкими людьми.',
        wishes: 'Главное — ваше присутствие. Вишлист помогает не повторяться с подарками.',
        coverImage: '',
        status: 'published',
        gifts: sampleGifts,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      saveEvents([demo]);
    }

    function render() {
      seed();
      currentUser = me();
      route = appPath();
      applyPageTheme();
      renderTopbar();
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      if (route === '/') return renderHome();
      if (route === '/login') return renderAuth('login');
      if (route === '/register') return renderAuth('register');
      if (route === '/dashboard') return guard(renderDashboard);
      if (route === '/dashboard/events/new') return guard(() => renderEditor(createDraft(), 'style'));
      const edit = route.match(/^\/dashboard\/events\/([^/]+)\/edit$/);
      if (edit) return guard(() => renderEditor(findEvent(edit[1])));
      const gifts = route.match(/^\/dashboard\/events\/([^/]+)\/gifts$/);
      if (gifts) return guard(() => renderEditor(findEvent(gifts[1]), 'gifts'));
      const preview = route.match(/^\/dashboard\/events\/([^/]+)\/preview$/);
      if (preview) return guard(() => renderPublic(findEvent(preview[1]), true));
      const pub = route.match(/^\/p\/([^/]+)$/);
      if (pub) return renderPublic(events().find(event => event.slug === pub[1]));
      renderHome();
    }
    function applyPageTheme(event = null) {
      const theme = event?.theme || 'pink';
      document.body.classList.toggle('theme-blue', theme === 'blue');
      document.body.classList.toggle('theme-neutral', theme === 'neutral');
    }
    function guard(next) {
      if (!currentUser) {
        navigate('/login');
        return;
      }
      next();
    }
    function findEvent(id) {
      return events().find(event => event.id === id);
    }
    function createDraft() {
      const event = {
        id: uid(),
        userId: currentUser.email,
        title: '',
        slug: `povod-${uid()}`,
        type: '',
        theme: 'pink',
        date: '',
        time: '',
        placeName: '',
        address: '',
        mapUrl: '',
        description: '',
        wishes: '',
        coverImage: '',
        status: 'draft',
        gifts: [],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      saveEvents([event, ...events()]);
      history.replaceState({}, '', `${BASE_PATH}/dashboard/events/${event.id}/edit`);
      return event;
    }
    function renderTopbar() {
      document.getElementById('topActions').innerHTML = currentUser ? `
        <button class="btn btn-soft" data-route="/dashboard">Мои поводы</button>
        <button class="btn btn-primary" onclick="logout()">Выйти</button>
      ` : `
        <button class="btn btn-soft" data-route="/login">Войти</button>
        <button class="btn btn-primary" data-route="/register">Создать карточку</button>
      `;
    }
    function renderHome() {
      applyPageTheme();
      const view = document.getElementById('homeView');
      view.classList.add('active');
      view.innerHTML = `
        <section class="hero">
          <div>
            <div class="eyebrow">Одна ссылка вместо хаоса в чатах</div>
            <h1>Соберите праздник, подарки и пожелания в одной красивой ссылке</h1>
            <p class="lead">Повод помогает гостям быстро понять, куда прийти, что подарить и какой подарок уже забронирован.</p>
            <div class="hero-actions">
              <button class="btn btn-accent" data-route="${currentUser ? '/dashboard/events/new' : '/register'}">Создать карточку</button>
              <button class="btn btn-soft" data-route="/p/meli-birthday">Посмотреть пример</button>
            </div>
            <p class="microcopy">Для дней рождения, baby shower, свадеб, новоселий и семейных праздников.</p>
          </div>
        </section>
        <section class="product-strip" aria-label="Что будет в карточке">
          <div class="product-pill"><b>Дата и место</b><span>Гости не ищут детали в чате</span></div>
          <div class="product-pill"><b>Карта</b><span>Ссылка на маршрут сразу под рукой</span></div>
          <div class="product-pill"><b>Подарки</b><span>Идеи, цены и ссылки в одном списке</span></div>
          <div class="product-pill"><b>Бронь</b><span>Видно, что уже выбрали другие</span></div>
        </section>
        <section>
          <div class="section-title"><h2>Не организует праздник за вас. Просто убирает хаос.</h2><p>Повод помогает собрать всё важное в одном месте: детали праздника, пожелания, подарки и бронь. А гостям — быстро понять, куда прийти и что подарить.</p></div>
          <div class="grid cols-5">
            ${[
              ['Всё о празднике — в одной ссылке','Дата, место, карта, пожелания и детали не теряются в переписке.', 'var(--peach)'],
              ['Подарки без дублей','Гость бронирует подарок, остальные видят, что он уже занят.', 'var(--lavender)'],
              ['Не неловкий вишлист','Это выглядит как заботливая подсказка, а не требование подарков.', 'var(--mint)'],
              ['Гостям проще выбрать','Можно добавить ссылки, цены, фото и комментарии.', 'var(--cream)'],
              ['Красиво отправить в чат','Ссылка выглядит как аккуратное приглашение, а не список в сообщении.', 'var(--primary-soft)']
            ].map((item, i) => `<div class="card info-card" style="--accent:${item[2]}"><div class="icon">${['•','✓','♡','↗','→'][i]}</div><h3>${item[0]}</h3><p>${item[1]}</p></div>`).join('')}
          </div>
        </section>
        <section>
          <div class="section-title"><h2>Как это работает</h2></div>
          <div class="steps-line">
            <div class="card step-card"><div class="step-num">1</div><h3>Создаёте повод</h3><p class="muted">Выбираете тип события, добавляете дату, место и пожелания.</p><div class="step-mini"><span class="mini-line"></span><span class="mini-line short"></span></div></div>
            <div class="card step-card"><div class="step-num">2</div><h3>Добавляете подарки</h3><p class="muted">Добавляете ссылки, картинки, цены и комментарии.</p><div class="step-mini"><span class="mini-line short"></span><span class="mini-line"></span></div></div>
            <div class="card step-card"><div class="step-num">3</div><h3>Отправляете гостям</h3><p class="muted">Гости открывают ссылку, выбирают подарок и бронируют его.</p><div class="step-mini"><span class="mini-line"></span><span class="mini-line short"></span></div></div>
          </div>
        </section>
        <section>
          <div class="section-title"><h2>Повод не только для детских дней рождения</h2><p>Начните с простой карточки, а дальше используйте сервис для любых событий, где есть гости, детали и подарки.</p></div>
          <div class="occasion-grid">${['Детский день рождения','Взрослый день рождения','Свадьба','Baby shower','Девичник','Новый год','Новоселье','Семейный праздник','Выпускной','Корпоратив'].map(x => `<span class="occasion-chip">${x}</span>`).join('')}</div>
        </section>
      `;
    }
    function renderAuth(mode) {
      const view = document.getElementById('authView');
      view.classList.add('active');
      const isLogin = mode === 'login';
      view.innerHTML = `
        <div class="card auth-card">
          <h2>${isLogin ? 'Войти в Повод' : 'Создать карточку'}</h2>
          <p class="muted">${isLogin ? 'Организатор входит, чтобы вернуться к своим поводам. Гостям регистрация не нужна.' : 'Самый быстрый способ сохранить карточку и потом её редактировать — через Telegram.'}</p>
          <div class="auth-primary">
            <h3>Через Telegram</h3>
            <p class="muted">Бот сохранит ваши карточки, пришлёт ссылку для гостей и позже сможет уведомлять о новых бронях подарков.</p>
            <div class="form-grid" style="grid-template-columns:1fr;margin-top:14px">
              <label>Имя или username в Telegram<input id="telegramName" placeholder="Например, Полина или @polina"></label>
            </div>
            <div class="hero-actions" style="margin-top:14px">
              <button class="btn btn-accent" onclick="telegramAuth()">${isLogin ? 'Продолжить через Telegram' : 'Сохранить через Telegram'}</button>
            </div>
            <p class="muted" style="font-size:12px">В этой демо-версии бот имитируется локально. Для продакшена нужен backend и настоящий Telegram Bot API.</p>
          </div>
          <div class="auth-divider">или</div>
          <details class="auth-secondary">
            <summary>${isLogin ? 'Войти другим способом' : 'Другой способ регистрации'}</summary>
            <div class="form-grid" style="grid-template-columns:1fr;margin-top:14px">
              ${!isLogin ? '<label>Имя<input id="authName" placeholder="Например, Полина"></label>' : ''}
              <label>Email<input id="authEmail" type="email" placeholder="you@example.com"></label>
              <label>Пароль<input id="authPassword" type="password" placeholder="Минимум 4 символа"></label>
            </div>
            <div class="hero-actions" style="margin-top:14px">
              <button class="btn btn-primary" onclick="${isLogin ? 'login()' : 'register()'}">${isLogin ? 'Войти по email' : 'Зарегистрироваться по email'}</button>
              <button class="btn btn-soft" data-route="${isLogin ? '/register' : '/login'}">${isLogin ? 'Создать аккаунт' : 'Уже есть аккаунт'}</button>
            </div>
          </details>
        </div>
      `;
    }
    function telegramAuth() {
      const rawName = document.getElementById('telegramName').value.trim();
      const username = rawName.replace(/^@/, '').trim();
      if (!username) return toast('Введите имя или username в Telegram');
      const telegramId = `tg_${slugify(username)}`;
      const email = `telegram:${telegramId}`;
      const list = users();
      const existing = list.find(user => user.email === email);
      if (!existing) {
        list.push({
          id: uid(),
          email,
          name: rawName.startsWith('@') ? rawName : username,
          telegramId,
          telegramUsername: rawName.startsWith('@') ? rawName : '',
          authProvider: 'telegram',
          createdAt: new Date().toISOString()
        });
        setJSON(STORAGE.users, list);
      }
      setSession(email);
      toast('Карточки сохранены через Telegram');
      navigate('/dashboard');
    }
    function register() {
      const name = document.getElementById('authName').value.trim();
      const email = document.getElementById('authEmail').value.trim().toLowerCase();
      const password = document.getElementById('authPassword').value;
      if (!email || password.length < 4) return toast('Введите email и пароль от 4 символов');
      const list = users();
      if (list.some(user => user.email === email)) return toast('Такой email уже зарегистрирован');
      list.push({ id: uid(), email, password, name, createdAt: new Date().toISOString() });
      setJSON(STORAGE.users, list);
      setSession(email);
      navigate('/dashboard');
    }
    function login() {
      const email = document.getElementById('authEmail').value.trim().toLowerCase();
      const password = document.getElementById('authPassword').value;
      const user = users().find(item => item.email === email && item.password === password);
      if (!user) return toast('Не нашли аккаунт с таким email и паролем');
      setSession(email);
      navigate('/dashboard');
    }
    function logout() {
      setSession(null);
      navigate('/');
    }
    function renderDashboard() {
      const view = document.getElementById('dashboardView');
      const own = events().filter(event => event.userId === currentUser.email);
      view.classList.add('active');
      view.innerHTML = `
        <div class="page-head">
          <div><h2>Мои поводы</h2><p>${displayUserName(currentUser)}, здесь хранятся черновики, опубликованные карточки и быстрые действия организатора.</p></div>
          <button class="btn btn-accent" data-route="/dashboard/events/new">Создать новый повод</button>
        </div>
        ${own.length ? `<div class="dashboard-grid">
          ${own.map(event => {
            const reservedCount = event.gifts.filter(g => g.status === 'reserved').length;
            return `<article class="card event-item">
              <div class="event-preview">${event.coverImage ? `<img src="${event.coverImage}" alt="">` : (event.type ? event.type.split(' ')[0] : 'Повод')}</div>
              <div>
                <span class="status-pill">${event.status === 'published' ? 'опубликована' : 'черновик'}</span>
                <h3>${event.title || 'Без названия'}</h3>
                <p class="muted">${event.date || 'Дата не указана'} · ${event.type || 'Тип повода не выбран'}</p>
                <div class="event-chips">
                  <span class="tag">${event.gifts.length} подарков</span>
                  <span class="tag">${reservedCount} забронировано</span>
                </div>
                <div class="event-actions">
                  <button class="btn btn-soft btn-small" data-route="/dashboard/events/${event.id}/edit">Редактировать</button>
                  <button class="btn btn-soft btn-small" data-route="/p/${event.slug}">Открыть</button>
                  <button class="btn btn-primary btn-small" onclick="copyText('${publicUrl(event)}')">Скопировать ссылку</button>
                  <button class="btn btn-soft btn-small" onclick="${event.status === 'published' ? `unpublishEvent('${event.id}')` : `publishEvent('${event.id}')`}">${event.status === 'published' ? 'Снять с публикации' : 'Опубликовать'}</button>
                </div>
              </div>
            </article>`;
          }).join('')}
        </div>` : `<div class="empty-state"><h3>Пока нет ни одного повода</h3><p class="muted">Создайте первую карточку и отправьте гостям одну красивую ссылку вместо хаоса в чате.</p><button class="btn btn-accent" data-route="/dashboard/events/new">Создать первый повод</button></div>`}
      `;
    }
    function renderEditor(event, tab = 'details') {
      if (!event) return navigate('/dashboard');
      applyPageTheme(event);
      currentEventId = event.id;
      editorTab = tab;
      const view = document.getElementById('editorView');
      view.classList.add('active');
      view.innerHTML = `
        <div class="page-head">
          <div><h2>${event.title ? 'Редактировать карточку' : 'Создать карточку праздника'}</h2><p>Заполните детали события, добавьте подарки и получите ссылку для гостей.</p></div>
          <button class="btn btn-soft" data-route="/dashboard">В кабинет</button>
        </div>
        <div class="editor-layout">
          <section class="card editor-card">
            ${renderStepProgress(event)}
            <div id="editorBody">${editorBody(event)}</div>
          </section>
        </div>
      `;
    }
    function renderStepProgress(event) {
      const index = BUILDER_STEPS.findIndex(step => step.id === editorTab);
      const current = Math.max(index, 0);
      const left = BUILDER_STEPS.length - current - 1;
      const note = left === 0 ? 'Финишный шаг: осталось опубликовать и скопировать ссылку.' : left === 1 ? 'Остался один шаг до ссылки для гостей.' : `Ещё ${left} шага — и карточка будет готова.`;
      return `
        <div class="step-progress">
          <div class="progress-meta"><span>Шаг ${current + 1} из ${BUILDER_STEPS.length}: ${BUILDER_STEPS[current].label}</span><span>${note}</span></div>

    function openCoverCrop(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) return toast('Загрузите изображение для обложки');
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          coverCrop = { image, baseScale: 1, scale: 1, x: 0, y: 0, dragging: false, startX: 0, startY: 0, originX: 0, originY: 0 };
          const imgNode = document.getElementById('cropImage');
          imgNode.src = reader.result;
          document.getElementById('cropScale').value = '1';
          document.getElementById('coverCropModal').classList.add('active');
          requestAnimationFrame(resetCoverCrop);
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    function resetCoverCrop() {
      if (!coverCrop) return;
      const stage = document.getElementById('cropStage').getBoundingClientRect();
      const frame = document.getElementById('cropFrame').getBoundingClientRect();
      coverCrop.baseScale = Math.max(frame.width / coverCrop.image.width, frame.height / coverCrop.image.height);
      coverCrop.scale = 1;
      coverCrop.x = 0;
      coverCrop.y = 0;
      applyCoverCrop();
    }
    function applyCoverCrop() {
      if (!coverCrop) return;
      constrainCoverCrop();
      const imgNode = document.getElementById('cropImage');
      const scale = coverCrop.baseScale * coverCrop.scale;
      imgNode.style.width = `${coverCrop.image.width}px`;
      imgNode.style.height = `${coverCrop.image.height}px`;
      imgNode.style.transform = `translate(calc(-50% + ${coverCrop.x}px), calc(-50% + ${coverCrop.y}px)) scale(${scale})`;
    }
    function constrainCoverCrop() {
      if (!coverCrop) return;
      const stage = document.getElementById('cropStage').getBoundingClientRect();
      const frame = document.getElementById('cropFrame').getBoundingClientRect();
      const scale = coverCrop.baseScale * coverCrop.scale;
      const imageWidth = coverCrop.image.width * scale;
      const imageHeight = coverCrop.image.height * scale;
      const maxX = Math.max(0, (imageWidth - frame.width) / 2);
      const maxY = Math.max(0, (imageHeight - frame.height) / 2);
      const frameCenterOffsetX = frame.left + frame.width / 2 - (stage.left + stage.width / 2);
      const frameCenterOffsetY = frame.top + frame.height / 2 - (stage.top + stage.height / 2);
      coverCrop.x = Math.min(maxX + frameCenterOffsetX, Math.max(-maxX + frameCenterOffsetX, coverCrop.x));
      coverCrop.y = Math.min(maxY + frameCenterOffsetY, Math.max(-maxY + frameCenterOffsetY, coverCrop.y));
    }
    function closeCoverCrop() {
      document.getElementById('coverCropModal').classList.remove('active');
      const input = document.getElementById('eventCover');

    function saveCroppedCover() {
      if (!coverCrop || !currentEventId) return;
      const stageRect = document.getElementById('cropStage').getBoundingClientRect();
      const frameRect = document.getElementById('cropFrame').getBoundingClientRect();
      const outputWidth = 1200;
      const outputHeight = 700;
      const canvas = document.createElement('canvas');
      canvas.width = outputWidth;
      canvas.height = outputHeight;
      const ctx = canvas.getContext('2d');
      const scale = coverCrop.baseScale * coverCrop.scale;
      const imageLeft = stageRect.left + stageRect.width / 2 + coverCrop.x - coverCrop.image.width * scale / 2;
      const imageTop = stageRect.top + stageRect.height / 2 + coverCrop.y - coverCrop.image.height * scale / 2;
      const sx = (frameRect.left - imageLeft) / scale;
      const sy = (frameRect.top - imageTop) / scale;
      const sw = frameRect.width / scale;
      const sh = frameRect.height / scale;
      ctx.drawImage(coverCrop.image, sx, sy, sw, sh, 0, 0, outputWidth, outputHeight);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      saveEvents(events().map(event => event.id === currentEventId ? { ...event, coverImage: dataUrl, updatedAt: new Date().toISOString() } : event));
      const preview = document.querySelector('.cover-preview');
      if (preview) preview.innerHTML = `<img src="${dataUrl}" alt="">`;
      closeCoverCrop();
      toast('Фото для карточки сохранено');

    function giftCard(gift) {
      const reserved = gift.status === 'reserved';
      return `<article class="card gift-card ${reserved ? 'reserved' : ''}"><div class="gift-img"><span class="status ${reserved ? 'reserved' : ''}">${reserved ? 'Уже забронирован' : 'Подарок свободен'}</span>${gift.image ? `<img src="${gift.image}" alt="">` : 'Фото'}</div><div class="gift-body"><h3>${gift.title}</h3><p>${gift.description || ''}</p><div class="gift-meta"><span class="price">${money(gift.price)}</span><span class="tag">${gift.category || 'Подарок'}</span></div><div class="gift-actions">${gift.url ? `<a class="btn btn-soft" href="${gift.url}" target="_blank" rel="noopener">Открыть магазин</a>` : '<button class="btn btn-soft" disabled>Ссылки нет</button>'}<button class="btn ${reserved ? 'btn-ghost' : 'btn-primary'}" ${reserved ? 'disabled' : ''} onclick="openReserve('${gift.id}')">${reserved ? 'Уже забронирован' : 'Забронировать'}</button></div></div></article>`;
    }
    function openReserve(giftId) {
      pendingReserve = { event: events().find(event => event.gifts.some(gift => gift.id === giftId)), giftId };
      const gift = pendingReserve.event.gifts.find(item => item.id === giftId);
      document.getElementById('reserveGiftName').textContent = gift.title;
      document.getElementById('reserveName').value = '';
      document.getElementById('reserveContact').value = '';
      document.getElementById('reserveComment').value = '';
      document.getElementById('reserveModal').classList.add('active');
    }
    function reserveGift(anonymous = false) {
      if (!pendingReserve) return;
      const name = anonymous ? 'Анонимно' : (document.getElementById('reserveName').value.trim() || 'Гость');
      const contact = anonymous ? '' : document.getElementById('reserveContact').value.trim();
      const comment = anonymous ? '' : document.getElementById('reserveComment').value.trim();
      saveEvents(events().map(event => event.id === pendingReserve.event.id ? { ...event, gifts: event.gifts.map(gift => gift.id === pendingReserve.giftId ? { ...gift, status: 'reserved', reservedByName: name, reservedByContact: contact, reservedComment: comment, reservedAt: new Date().toISOString() } : gift) } : event));
      closeModal('reserveModal');
      toast('Подарок забронирован');
      renderPublic(events().find(event => event.id === pendingReserve.event.id));
      pendingReserve = null;
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); toast('Ссылка скопирована'); }
      catch { toast(text); }
    }
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-route]');
      if (!target) return;
      event.preventDefault();
      navigate(target.dataset.route);
    });
    document.getElementById('cropScale').addEventListener('input', event => {
      if (!coverCrop) return;
      coverCrop.scale = Number(event.target.value);
      applyCoverCrop();
    });
    document.getElementById('cropStage').addEventListener('pointerdown', event => {
      if (!coverCrop) return;
      coverCrop.dragging = true;
      coverCrop.startX = event.clientX;
      coverCrop.startY = event.clientY;
      coverCrop.originX = coverCrop.x;
      coverCrop.originY = coverCrop.y;
      event.currentTarget.setPointerCapture(event.pointerId);
    });
    document.getElementById('cropStage').addEventListener('pointermove', event => {
      if (!coverCrop?.dragging) return;
      coverCrop.x = coverCrop.originX + event.clientX - coverCrop.startX;
      coverCrop.y = coverCrop.originY + event.clientY - coverCrop.startY;
      applyCoverCrop();
    });
    document.getElementById('cropStage').addEventListener('pointerup', event => {
      if (!coverCrop) return;
      coverCrop.dragging = false;
      event.currentTarget.releasePointerCapture(event.pointerId);
    });
    document.getElementById('cropStage').addEventListener('pointercancel', () => {
      if (coverCrop) coverCrop.dragging = false;
    });
    window.addEventListener('popstate', render);
    render();
  </script>
</body>
</html>
