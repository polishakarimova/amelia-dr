<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Повод — карточка праздника в одной ссылке</title>
  <meta name="description" content="Повод — красивая карточка праздника в одной ссылке. Дата, место, пожелания, подарки и статусы брони подарков для гостей." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #FBF7F2;
      --bg-soft: #FFF4EC;
      --surface: #FFFFFF;
      --surface-warm: #FFF7F0;
      --surface-solid: #FFFFFF;
      --card-soft: #FFF4EA;
      --text: #3A312B;
      --text-dark: #2B2521;
      --muted: #7E746D;
      --muted-light: #A2968D;
      --border: rgba(76, 60, 47, 0.12);
      --primary: #F47B5C;
      --primary-hover: #E6684A;
      --primary-soft: #FFE2D8;
      --gold: #E4A93E;
      --gold-soft: #FFF1D3;
      --lavender: #B8A3C9;
      --lavender-soft: #F1EAF7;
      --olive: #B8CA7A;
      --olive-soft: #EEF4D7;
      --peach: #FFD7C4;
      --peach-soft: #FFF0E6;
      --mint: var(--olive-soft);
      --cream: var(--gold-soft);
      --dark: var(--text-dark);
      --dark-hover: #171411;
      --success: #3D9B6D;
      --success-soft: #E2F5EC;
      --warning: #C9822B;
      --warning-soft: #FFF1D6;
      --danger: #D85A4A;
      --danger-soft: #FFE1DE;
      --milk: var(--bg);
      --paper: var(--surface);
      --paper-strong: var(--surface-solid);
      --ink: var(--text);
      --line: var(--border);
      --coral: var(--primary);
      --coral-dark: var(--primary-hover);
      --blue: var(--lavender);
      --sand: var(--bg-soft);
      --green: #3f8d68;
      --shadow: 0 18px 60px rgba(70, 54, 42, 0.08);
      --shadow-soft: 0 18px 60px rgba(70, 54, 42, 0.08);
      --shadow-card: 0 10px 30px rgba(70, 54, 42, 0.06);
      --shadow-hover: 0 18px 44px rgba(70, 54, 42, 0.10);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --radius-pill: 999px;
    }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Onest, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 10%, rgba(242, 111, 85, .18), transparent 30%),
        radial-gradient(circle at 86% 8%, rgba(184, 161, 201, .20), transparent 28%),
        radial-gradient(circle at 76% 74%, rgba(184, 201, 124, .16), transparent 32%),
        linear-gradient(180deg, var(--bg) 0%, var(--surface-warm) 48%, #fff 100%);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body.theme-blue {
      --coral: #5aa6e8;
      --coral-dark: #2367a7;
      --lavender: #8fc7e8;
      --sand: #e8f4ff;
      background:
        radial-gradient(circle at 9% 10%, rgba(90,166,232,.22), transparent 28%),
        radial-gradient(circle at 84% 7%, rgba(143,199,232,.25), transparent 26%),
        radial-gradient(circle at 76% 74%, rgba(185,168,255,.16), transparent 30%),
        linear-gradient(180deg, #f7fbff 0%, #eef7ff 45%, #fff 100%);
    }
    body.theme-neutral,
    body.theme-beige {
      --coral: #8b7a66;
      --coral-dark: #5b4e42;
      --lavender: #d0c8bd;
      --sand: #f0ebe5;
      background:
        radial-gradient(circle at 9% 10%, rgba(139,122,102,.16), transparent 28%),
        radial-gradient(circle at 84% 7%, rgba(143,199,232,.14), transparent 26%),
        linear-gradient(180deg, #fbfaf8 0%, #f3eee8 45%, #fff 100%);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 18px 34px;
    }
    .topbar {
      position: sticky;
      top: calc(10px + env(safe-area-inset-top));
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 8px;
      margin: 0 0 20px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 28px;
      background: rgba(255,255,255,.62);
      box-shadow: 0 18px 54px rgba(53,39,31,.08);
      backdrop-filter: blur(22px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-weight: 780;
      font-size: 18px;
      letter-spacing: -.015em;
      text-decoration: none;
      padding: 4px 8px 4px 4px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 15px;
      background: var(--surface);
      border: 1px solid rgba(242,111,85,.18);
      box-shadow: 0 12px 30px rgba(242,111,85,.16);
      color: var(--coral-dark);
      font-size: 18px;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      border: 0;
      padding: 11px 17px;
      font-weight: 780;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.98); }
    .btn[disabled] {
      cursor: wait;
      opacity: .72;
      transform: none;
    }
    .btn-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid currentColor;
      border-right-color: transparent;
      animation: spin .72s linear infinite;
    }
    .btn.is-loading .btn-spinner { display: inline-block; }
    .btn.is-done {
      background: #eef7e8;
      color: #4f7a58;
      border-color: rgba(86, 132, 82, .25);
    }
    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 16px 34px rgba(37,35,33,.18);
    }
    .btn-accent {
      background: linear-gradient(135deg, var(--coral), #e8a05d);
      color: #fff;
      box-shadow: 0 18px 42px rgba(230,111,92,.24);
    }
    .btn-soft {
      background: rgba(255,255,255,.72);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
    }
    .btn-small { min-height: 44px; padding: 8px 12px; font-size: 13px; }
    .btn-danger { color: #9b2f26; background: #fff1ee; border: 1px solid rgba(230,111,92,.25); }
    .view { display: none; animation: enter .24s ease both; }
    .view.active { display: block; }
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0 18px;
    }
    .admin-stat {
      min-height: 86px;
      padding: 14px;
    }
    .admin-stat b {
      display: block;
      font-size: 26px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .admin-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0;
    }
    .admin-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.72);
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
      font-size: 14px;
    }
    .admin-table th,
    .admin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .admin-table th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: rgba(255,255,255,.58);
    }
    .admin-table tr:last-child td { border-bottom: 0; }
    .admin-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0 18px;
    }
    .admin-form label:last-child { grid-column: 1 / -1; }
    .admin-token-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 42px;
      align-items: center;
      max-width: 840px;
      padding: 58px 0 38px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      border: 1px solid var(--line);
      color: var(--coral-dark);
      font-size: 13px;
      font-weight: 800;
    }
    h1, h2, h3, h4 { margin: 0; letter-spacing: -.025em; font-weight: 800; }
    h1 {
      max-width: 760px;
      font-size: clamp(40px, 5.4vw, 68px);
      line-height: 1.03;
      margin-bottom: 20px;
      text-wrap: balance;
    }
    .lead {
      max-width: 640px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.55;
      margin: 0 0 26px;
      text-wrap: pretty;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .microcopy { max-width: 620px; color: #817970; font-size: 13px; line-height: 1.55; }
    .bottom-cta { padding-bottom: 34px; }
    .bottom-cta .card {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px;
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(255, 225, 214, 0.72));
    }
    .bottom-cta .hero-actions { justify-content: center; }
    .muted { color: var(--muted); }
    .status { font-size: 12px; font-weight: 850; color: var(--green); }
    .status.reserved { color: var(--coral-dark); }
    .section-title { max-width: 780px; margin: 54px auto 20px; text-align: center; }
    .section-title h2 { font-size: clamp(30px, 4vw, 48px); line-height: 1.04; margin-bottom: 10px; text-wrap: balance; }
    .section-title p { color: var(--muted); line-height: 1.65; text-wrap: pretty; }
    .grid { display: grid; gap: 14px; }
    .grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .card {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 14px 42px rgba(53,39,31,.08);
    }
    .info-card { padding: 22px; min-height: 156px; }
    .info-card .icon {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 15px;
      background: #fff;
      color: var(--coral-dark);
      margin-bottom: 13px;
      font-weight: 900;
    }
    .info-card h3 { font-size: 18px; margin-bottom: 8px; }
    .info-card p { color: var(--muted); line-height: 1.55; font-size: 14px; margin: 0; }
    .steps-line { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .step-card { padding: 24px; }
    .step-num {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 50%; background: var(--ink); color: #fff;
      font-weight: 800; margin-bottom: 14px;
    }
    .occasion-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .occasion-chip {
      padding: 12px 15px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 750;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 36px 0 20px;
    }
    .page-head h2 { font-size: clamp(34px, 4.2vw, 52px); line-height: 1.05; margin-bottom: 10px; }
    .page-head p { color: var(--muted); line-height: 1.6; max-width: 640px; }
    .auth-card, .panel { max-width: 520px; margin: 26px auto; padding: 24px; }
    .auth-primary {
      margin-top: 18px;
      padding: 16px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(143,199,232,.22), rgba(255,255,255,.78));
      border: 1px solid rgba(143,199,232,.32);
    }
    .auth-primary h3 { font-size: 19px; margin-bottom: 6px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 750; }
    label.full { grid-column: 1 / -1; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.9);
      color: var(--ink);
      outline: none;
      padding: 13px 14px;
    }
    textarea { resize: vertical; min-height: 92px; }
    input:focus, textarea:focus, select:focus { border-color: rgba(230,111,92,.42); box-shadow: 0 0 0 4px rgba(230,111,92,.08); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .event-item {
      position: relative;
      padding: 16px;
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 14px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .event-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .event-preview {
      height: 76px;
      border-radius: 18px;
      background: linear-gradient(135deg, #fff0e7, #ede9ff);
      display: grid; place-items: center;
      color: var(--coral-dark);
      font-weight: 900;
      overflow: hidden;
    }
    .event-preview img { width: 100%; height: 100%; object-fit: cover; }
    .event-topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-right: 38px; }
    .event-item h3 { font-size: 20px; margin-bottom: 5px; }
    .event-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .status-pill {
      display: inline-flex; width: fit-content;
      padding: 5px 8px; border-radius: 999px;
      background: #fff; border: 1px solid var(--line);
      color: var(--muted); font-size: 11px; font-weight: 850;
      line-height: 1;
    }
    .status-pill.draft {
      background: var(--gold-soft);
      border-color: rgba(228,169,62,.28);
      color: #8c6122;
    }
    .status-pill.published {
      background: var(--success-soft);
      border-color: rgba(61,155,109,.24);
      color: var(--success);
    }
    .event-menu {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
    }
    .event-menu summary {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      list-style: none;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 900;
      cursor: pointer;
    }
    .event-menu summary::-webkit-details-marker { display: none; }
    .event-menu[open] summary { box-shadow: 0 10px 24px rgba(50,40,35,.12); }
    .event-menu-list {
      position: absolute;
      right: 0;
      top: 38px;
      min-width: 178px;
      display: grid;
      gap: 4px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--line);
      box-shadow: 0 18px 46px rgba(50,40,35,.14);
    }
    .event-menu-list button {
      min-height: 36px;
      justify-content: flex-start;
      padding: 8px 10px;
      border-radius: 12px;
      box-shadow: none;
    }
    .event-menu-list .danger { color: var(--danger); }
    .preview-actions {
      margin-top: 18px;
      padding: 14px;
      border-radius: 24px;
      background: rgba(255,255,255,.74);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-card);
    }
    .editor-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
    .editor-card { padding: 22px; max-width: 850px; }
    .step-progress {
      display: grid;
      gap: 12px;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 24px;
      background: rgba(255,255,255,.58);
      border: 1px solid var(--line);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(37,35,33,.08);
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--coral), #e8a05d);
      transition: width .24s ease;
    }
    .step-dots {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .tab { flex: 0 0 auto; }
    .tab.active { background: var(--ink); color: #fff; }
    .tab.done { background: rgba(255,255,255,.8); color: var(--coral-dark); }
    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-option {
      padding: 15px; border-radius: 20px; border: 1px solid var(--line);
      background: rgba(255,255,255,.72); text-align: left;
    }
    .theme-option b { display: block; font-size: 17px; margin-bottom: 5px; }
    .theme-option.active { border-color: rgba(230,111,92,.45); box-shadow: 0 14px 32px rgba(230,111,92,.12); }
    .cover-upload {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 16px;
      align-items: center;
      padding: 14px;
      border: 1px dashed rgba(230,111,92,.38);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,241,236,.72), rgba(255,255,255,.72));
    }
    .cover-preview {
      height: 140px;
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 25%, rgba(230,111,92,.25), transparent 34%),
        radial-gradient(circle at 78% 16%, rgba(143,199,232,.28), transparent 34%),

      font-weight: 850;

    }

      color: rgba(112,106,100,.68);
      font-size: 12px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.45;
    }
    .template-box {

      padding: 8px 12px;
      font-size: 13px;
    }
    .gift-editor { display: grid; gap: 10px; }

      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 24px;
      background: rgba(255,255,255,.7);
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .guest-layout { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .guest-side { position: sticky; top: 88px; padding: 18px; }

      min-height: 170px; border-radius: 26px; margin-bottom: 16px;

      gap: 12px;
      margin: -6px;
      padding: 10px;
      border-radius: 34px;

        method: options.method || 'GET',
        credentials: 'include',
        headers: { ...(options.headers || {}) }

      if (options.body !== undefined) {
        init.headers['content-type'] = 'application/json';
        init.body = typeof options.body === 'string' ? options.body : JSON.stringify(options.body);
      }
      const response = await fetch(path, init);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || `request_failed_${response.status}`);
        error.status = response.status;
        error.data = data;
        throw error;
      }
      return data;

    function resumeTelegramLogin() {
      const params = new URLSearchParams(location.search);
      const queryToken = params.get('telegramLoginToken');
      const queryConsent = params.get('telegramConsent') === '1';
      if (queryToken) {
        localStorage.setItem(STORAGE.telegramLoginToken, queryToken);
        if (queryConsent) localStorage.setItem(STORAGE.telegramConsent, '1');
        history.replaceState({}, '', `${BASE_PATH}/login`);

      const token = queryToken || localStorage.getItem(STORAGE.telegramLoginToken);
      if (!token || telegramAuthDone) return;
      startTelegramLoginPolling(token);

    function stopTelegramLoginPolling() {
      if (telegramLoginPollTimer) clearInterval(telegramLoginPollTimer);
      telegramLoginPollTimer = null;
      telegramLoginPollToken = '';
    }
    function clearTelegramLoginFallback() {
      localStorage.removeItem(STORAGE.telegramLoginToken);
    }
    function startTelegramLoginPolling(token) {
      if (!token) return;
      if (telegramLoginPollTimer && telegramLoginPollToken === token) return;
      stopTelegramLoginPolling();
      telegramLoginPollToken = token;
      let attempts = 0;
      const check = async () => {
        attempts += 1;
        try {
          const data = await apiRequest(`/api/auth/telegram-login-token/${encodeURIComponent(token)}`);
          if (data.status === 'pending') {
            if (attempts > 120) {
              stopTelegramLoginPolling();
              clearTelegramLoginFallback();
              toast('Ссылка для входа устарела. Нажмите Telegram ещё раз.');
            }
            return;
          }
          if (!data.user) return;
          stopTelegramLoginPolling();
          clearTelegramLoginFallback();
          syncServerUser(data.user);
          await loadServerEvents();
          telegramAuthDone = true;
          toast('Вы вошли через Telegram');
          navigate('/');
        } catch (error) {
          if (error.status === 202) return;
          if (error.status === 404 || error.status === 410) {
            stopTelegramLoginPolling();
            clearTelegramLoginFallback();
            if (attempts > 1) toast('Ссылка для входа устарела. Нажмите Telegram ещё раз.');
            return;
          }
          if (attempts > 6) {
            stopTelegramLoginPolling();
            toast('Не получается проверить вход. Обновите страницу и попробуйте ещё раз.');
          }
        }
      };
      check();
      telegramLoginPollTimer = setInterval(check, 2500);
    }
    async function telegramAuth(eventOrSilent = false) {

      const webApp = telegramWebApp();
      const initData = webApp?.initData || '';

        if (clickEvent) return;
        if (!silent) await startTelegramLogin();

          body: JSON.stringify({

            telegramLoginToken: new URLSearchParams(location.search).get('telegramLoginToken') || localStorage.getItem(STORAGE.telegramLoginToken) || '',
            consentAccepted: new URLSearchParams(location.search).get('telegramConsent') === '1' || localStorage.getItem(STORAGE.telegramConsent) === '1'
          })

        const data = await response.json();

        if (!silent) toast('Не получилось войти через Telegram. Откройте через бота ещё раз.');

        telegramAuthInProgress = false;
      }

      const slots = [{ item: list[safeIndex], position: 'is-active', key: 'active' }];
      if (list.length > 1) {
        slots.unshift({ item: list[leftIndex], position: 'is-left', key: 'left' });

      const fallbackTemplate = mode ? templatesForValues(normalizedTheme, mode)[0] : null;
      applyPageTheme({ theme: normalizedTheme });

            || parsed.searchParams.has('productId')
            || parsed.searchParams.has('productid')
            || parsed.searchParams.has('do-waremd5');
        }
      } catch {
        return false;
      }
      return true;
    }
    function prefillGiftFromUrl(force = false) {
      const url = normalizeGiftUrlInput();
      const urlKey = normalizedGiftPreviewUrl(url);
      clearTimeout(giftPreviewTimer);
      if (!url) {
        giftUrlStatus('Если ссылка из Wildberries, Ozon, Яндекс Маркета или Детского мира, название, цена и фото подтянутся автоматически. Нажмите «Заполнить автоматически».');
        giftPrefillButtonState('idle');
        return Promise.resolve(false);
      }
      if (!isSupportedGiftStoreUrl(url)) {
        const message = supportedStoreMessage();
        giftUrlStatus(message);
        if (force) showGiftStoreNotice(message);
        giftPrefillButtonState('idle');
        return Promise.resolve(false);
      }
      if (!isProbablyProductGiftUrl(url)) {
        giftUrlStatus(`Вставьте полную ссылку на товар ${giftStoreName(url)}. Автозаполнение не запускается, пока ссылка похожа на неполную.`);
        giftPrefillButtonState('idle');
        return Promise.resolve(false);
      }
      if (giftPreviewLoadedUrl === urlKey && hasGiftPreviewFields()) {
        giftPrefillButtonState('done');
        giftUrlStatus('Готово: данные по этой ссылке уже заполнены.');
        return Promise.resolve(true);
      }
      if (giftPreviewInFlightUrl === urlKey && giftPreviewInFlightPromise) {
        giftPrefillButtonState('loading');
        return giftPreviewInFlightPromise;
      }
      giftPrefillButtonState('idle');
      const run = () => {
        const requestId = ++giftPreviewRequest;
        const promise = (async () => {
          giftPrefillButtonState('loading');
          giftUrlStatus(`Подтягиваю данные с ${giftStoreName(url)}...`);
          try {
            const data = await apiRequest('/api/gift-preview', { method: 'POST', body: { url } });
            if (requestId !== giftPreviewRequest || normalizedGiftPreviewUrl(document.getElementById('giftUrl')?.value || '') !== urlKey) return false;
            applyGiftPreview(data.preview || {});
            giftPreviewLoadedUrl = urlKey;
            giftPrefillButtonState('done');
            const resultMessage = giftPreviewResultMessage(data.preview || {});
            giftUrlStatus(data.preview?.cached
              ? resultMessage.replace('Готово:', 'Готово: взяла данные из кеша,')
              : resultMessage);
            return true;
          } catch (error) {
            if (requestId !== giftPreviewRequest || normalizedGiftPreviewUrl(document.getElementById('giftUrl')?.value || '') !== urlKey) return false;
            giftPrefillButtonState('error');
            const message = error.message === 'unsupported_store'
              ? supportedStoreMessage()
              : `Не получилось подтянуть данные с ${giftStoreName(url)}. Проверьте ссылку или попробуйте ещё раз.`;
            giftUrlStatus(message);
            if (error.message === 'unsupported_store') showGiftStoreNotice(message);
            else toast(message);
            return false;
          } finally {
            if (giftPreviewInFlightUrl === urlKey) {
              giftPreviewInFlightUrl = '';
              giftPreviewInFlightPromise = null;
            }
          }
        })();
        giftPreviewInFlightUrl = urlKey;
        giftPreviewInFlightPromise = promise;
        return promise;
      };
      if (force) return run();
      giftPreviewTimer = setTimeout(run, ['Ozon', 'Яндекс Маркет'].includes(giftStoreName(url)) ? 1400 : 900);
      return Promise.resolve(false);
    }
    async function saveGift(eventId) {
      const event = findEvent(eventId);
      let url = normalizeGiftUrlInput();
      if (url && isSupportedGiftStoreUrl(url)) {
        const hasPreview = giftPreviewLoadedUrl === normalizedGiftPreviewUrl(url) && hasGiftPreviewFields();
        if (!hasPreview) {
          const loaded = await prefillGiftFromUrl(true);
          if (!loaded) return toast(`Не получилось подтянуть товар с ${giftStoreName(url)}. Проверьте ссылку и попробуйте ещё раз.`);
          url = normalizeGiftUrlInput();
        }
      }
      const title = document.getElementById('giftTitle').value.trim();
      if (!url && !title) return toast('Добавьте ссылку или название подарка');
      const gift = {
        id: uid(),
        title,
        description: document.getElementById('giftDescription')?.value.trim() || '',
        url,
        price: Number(document.getElementById('giftPrice').value || 0),
        image: document.getElementById('giftImage').value.trim(),
        category: event.gifts.find(item => item.id === editingGiftId)?.category || 'Подарок',
        status: 'available'
      };
      try {
        const cachedEvent = findEvent(eventId) || event;
        let nextEvent;
        if (editingGiftId) {
          const giftId = editingGiftId;
          const data = await apiRequest(`/api/gifts/${giftId}`, { method: 'PATCH', body: gift });
          nextEvent = { ...cachedEvent, gifts: cachedEvent.gifts.map(item => item.id === giftId ? data.gift : item) };
        } else {
          const data = await apiRequest(`/api/events/${eventId}/gifts`, { method: 'POST', body: gift });
          nextEvent = { ...cachedEvent, gifts: [data.gift, ...cachedEvent.gifts] };
        }
        giftFormOpen = false;
        editingGiftId = null;
        upsertEventCache(nextEvent);
        toast('Подарок сохранён');
        renderEditor(nextEvent, 'gifts');
      } catch (error) {
        toast(error.message === 'gift_preview_failed' ? 'Не получилось подтянуть товар. Проверьте ссылку Wildberries, Ozon, Яндекс Маркета или Детского мира и попробуйте ещё раз.' : 'Не получилось сохранить подарок');
      }
      return;
    }
    async function deleteGift(eventId, giftId) {
      if (!confirm('Удалить этот подарок из карточки?')) return;
      const event = findEvent(eventId);
      try {
        await apiRequest(`/api/gifts/${giftId}`, { method: 'DELETE' });
        const nextEvent = { ...event, gifts: event.gifts.filter(gift => gift.id !== giftId) };
        upsertEventCache(nextEvent);
        toast('Подарок удалён');
        renderEditor(nextEvent, 'gifts');
      } catch {
        toast('Не получилось удалить подарок');
      }
      return;
    }
    async function deleteEvent(id) {
      const event = findEvent(id);
      const title = event?.title || 'этот повод';
      if (!confirm(`Удалить «${title}»? Это удалит карточку и все подарки внутри.`)) return;
      try {
        await apiRequest(`/api/events/${id}`, { method: 'DELETE' });
        eventsCache = eventsCache.filter(item => item.id !== id);
        setJSON(STORAGE.events, eventsCache);
        toast('Повод удалён');
        renderDashboard();
      } catch {
        toast('Не получилось удалить повод');
      }
      return;
    }
    async function publishEvent(id) {
      try {
        const data = await apiRequest(`/api/events/${id}/publish`, { method: 'POST', body: {} });
        upsertEventCache(data.event);
        toast('Карточка опубликована');
        render();
      } catch {
        toast('Не получилось опубликовать карточку');
      }
      return;
    }
    async function unpublishEvent(id) {
      try {
        const data = await apiRequest(`/api/events/${id}/unpublish`, { method: 'POST', body: {} });
        upsertEventCache(data.event);
        toast('Карточка снята с публикации');
        render();
      } catch {
        toast('Не получилось снять карточку с публикации');
      }
      return;
    }
    function renderPublic(event, preview = false) {
      const view = document.getElementById('publicView');
      view.classList.add('active');
      if (!event) {
        view.innerHTML = '<div class="card panel"><h2>Карточка не найдена</h2><p class="muted">Возможно, ссылка устарела.</p></div>';
        return;
      }
      applyPageTheme(event);
      const unpublishedNotice = event.status !== 'published' && !preview
        ? '<div class="public-notice">Карточка пока не опубликована. Гости увидят её после публикации организатором.</div>'
        : '';
      const previewActions = preview ? `
        <div class="preview-actions hero-actions">
          <button class="btn btn-soft" data-route="/dashboard">В кабинет</button>
          <button class="btn btn-primary" data-route="/dashboard/events/${event.id}/edit">Редактировать</button>
          <button class="btn btn-soft" data-route="/dashboard/events/${event.id}/gifts">Подарки</button>
          <button class="btn btn-soft" onclick="copyText('${publicUrl(event)}')">Скопировать ссылку</button>
          <button class="btn btn-accent" onclick="${event.status === 'published' ? `unpublishEvent('${event.id}')` : `publishEvent('${event.id}')`}">${event.status === 'published' ? 'Снять публикацию' : 'Опубликовать'}</button>
        </div>` : '';
      view.innerHTML = `
        ${unpublishedNotice}
        <div class="page-head"><div><h2>${preview ? 'Предпросмотр карточки' : event.title}</h2><p>${preview ? 'Так карточку увидит гость. Предпросмотр доступен даже для черновика.' : 'Откройте детали праздника и список подарков.'}</p></div>${preview ? '<button class="btn btn-soft" data-route="/dashboard">В кабинет</button>' : '<button class="btn btn-accent" data-route="/">Создать свою карточку</button>'}</div>
        <div class="guest-layout">
          <aside class="card guest-side">
            ${eventSummary(event)}
          </aside>
          <section>
            ${giftsIntro(event)}
            <div class="guest-gifts">${giftsGrid(event)}</div>
            <div class="footer">Создано в Поводе · <button class="btn btn-soft btn-small" data-route="/">Создать свою карточку</button></div>
          </section>
        </div>
        ${previewActions}`;
    }
    function giftCard(gift) {
      const reserved = gift.status === 'reserved';
      return `<article class="card gift-card ${reserved ? 'reserved' : ''}"><div class="gift-img">${gift.image ? `<img src="${gift.image}" alt="">` : 'Фото'}</div><div class="gift-body"><h3>${gift.title}</h3><div class="gift-meta"><span class="price">${money(gift.price)}</span></div><div class="gift-actions">${gift.url ? `<a class="btn btn-soft" href="${gift.url}" target="_blank" rel="noopener">Открыть магазин</a>` : '<button class="btn btn-soft" disabled>Ссылки нет</button>'}<button class="btn ${reserved ? 'btn-ghost' : 'btn-primary'}" ${reserved ? 'disabled' : ''} onclick="openReserve('${gift.id}')">${reserved ? 'Уже забронирован' : 'Забронировать подарок'}</button></div></div></article>`;
    }
    function openReserve(giftId) {
      pendingReserve = { event: eventByGiftId(giftId), giftId };
      if (!pendingReserve.event) return toast('Подарок не найден');
      const gift = pendingReserve.event.gifts.find(item => item.id === giftId);
      document.getElementById('reserveGiftName').textContent = gift.title;
      document.getElementById('reserveName').value = '';
      document.getElementById('reserveContact').value = '';
      document.getElementById('reserveComment').value = '';
      document.getElementById('reserveModal').classList.add('active');
    }
    async function reserveGift(anonymous = false) {
      if (!pendingReserve) return;
      const name = anonymous ? 'Анонимно' : (document.getElementById('reserveName').value.trim() || 'Гость');
      const contact = anonymous ? '' : document.getElementById('reserveContact').value.trim();
      const comment = anonymous ? '' : document.getElementById('reserveComment').value.trim();
      try {
        const data = await apiRequest(`/api/public/gifts/${pendingReserve.giftId}/reserve`, {
          method: 'POST',
          body: { name, contact, comment }
        });
        const nextEvent = {
          ...pendingReserve.event,
          gifts: pendingReserve.event.gifts.map(gift => gift.id === pendingReserve.giftId ? data.gift : gift)
        };
        publicEventCache[nextEvent.slug] = nextEvent;
        upsertEventCache(nextEvent);
        closeModal('reserveModal');
        toast('Подарок забронирован');
        renderPublic(nextEvent);
        pendingReserve = null;
      } catch (error) {
        toast(error.status === 409 ? 'Этот подарок уже забронировали' : 'Не получилось забронировать подарок');
      }
      return;
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); toast('Ссылка скопирована'); }
      catch { toast(text); }
    }
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-route]');
      if (!target) return;
      event.preventDefault();
      navigate(target.dataset.route);
    });
    document.getElementById('cropScale').addEventListener('input', event => {
      if (!coverCrop) return;
      coverCrop.scale = Number(event.target.value);
      applyCoverCrop();
    });
    document.getElementById('cropStage').addEventListener('pointerdown', event => {
      if (!coverCrop) return;
      coverCrop.dragging = true;
      coverCrop.startX = event.clientX;
      coverCrop.startY = event.clientY;
      coverCrop.originX = coverCrop.x;
      coverCrop.originY = coverCrop.y;
      event.currentTarget.setPointerCapture(event.pointerId);
    });
    document.getElementById('cropStage').addEventListener('pointermove', event => {
      if (!coverCrop?.dragging) return;
      coverCrop.x = coverCrop.originX + event.clientX - coverCrop.startX;
      coverCrop.y = coverCrop.originY + event.clientY - coverCrop.startY;
      applyCoverCrop();
    });
    document.getElementById('cropStage').addEventListener('pointerup', event => {
      if (!coverCrop) return;
      coverCrop.dragging = false;
      event.currentTarget.releasePointerCapture(event.pointerId);
    });
    document.getElementById('cropStage').addEventListener('pointercancel', () => {
      if (coverCrop) coverCrop.dragging = false;
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) resumeTelegramLogin();
    });
    window.addEventListener('focus', resumeTelegramLogin);
    window.addEventListener('popstate', render);
    render();
  </script>
</body>
</html>
